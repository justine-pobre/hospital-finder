<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Finder</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&libraries=places,geometry&callback=initMap" async defer></script>
</head>
<body>
  <div id="hero">
    <input type="text" id="postcode-search" placeholder="Enter postcode or town">
    <select id="radius-select">
      <option value="5">5 miles</option>
      <option value="10">10 miles</option>
      <option value="25" selected>25 miles</option>
      <option value="50">50 miles</option>
    </select>
    <button id="search-button">Search</button>
  </div>
  <div id="map"></div>
  <div id="results-header"></div>
  <div id="results-container"></div>
</body>
</html>
